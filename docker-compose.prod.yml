services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: tms_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tms_db
    ports:
      - "3306:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - tms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Backend (Python/FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms_backend_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tms_network

  # Frontend (React/Vite) built for Production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tms_frontend_prod
    restart: always
    ports:
      - "5173:80"
    networks:
      - tms_network
    depends_on:
      - backend

networks:
  tms_network:
    driver: bridge

volumes:
  db_data_prod:
