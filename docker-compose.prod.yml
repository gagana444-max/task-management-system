services:
  # Backend (Python/FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms_backend_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - tms_network

  # Frontend (React/Vite) built for Production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: tms_frontend_prod
    restart: always
    ports:
      - "5173:80"
    networks:
      - tms_network
    depends_on:
      - backend

networks:
  tms_network:
    driver: bridge
