

services:
  # Backend (Python/FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    networks:
      - tms_network

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tms_frontend
    restart: always
    ports:
      - "5173:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tms_network
    depends_on:
      - backend

networks:
  tms_network:
    driver: bridge